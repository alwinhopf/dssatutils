name: smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  fast-unit:
    name: Fast Unit (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run complete Python offline suite
        shell: bash
        run: bash scripts/pre-push.sh

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fast-unit-python-results
          path: |
            test-results.xml
            fast-tests.log

  language-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libsqlite3-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload, any::testthat, any::ncdf4, any::DBI, any::RSQLite, any::ecmwfr
          install-pandoc: false

      - name: Run R offline tests
        shell: bash
        env:
          RUN_POLARIS_LIVE: "false"
        run: >-
          "$(command -v Rscript)" --vanilla -e
          'pkgload::load_all(".", quiet=TRUE);
          reporter <- testthat::MultiReporter$new(list(testthat::SummaryReporter$new(), testthat::JunitReporter$new(file=file.path(getwd(), "r-test-results.xml"))));
          testthat::test_dir("tests/testthat", reporter=reporter, stop_on_failure=TRUE)'
          2>&1 | tee r-tests.log

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: r-parity-${{ runner.os }}-logs
          path: |
            *.log
            r-test-results.xml
          if-no-files-found: ignore

  platform-compat:
    name: Platform Compat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python offline suite
        shell: bash
        run: bash scripts/pre-push.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: platform-compat-${{ matrix.os }}-results
          path: |
            test-results.xml
            fast-tests.log
