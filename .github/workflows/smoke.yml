name: smoke

# Offline smoke test: no internet APIs, no DSSAT executable required.
# Validates config loading, helper-module imports, and the DSSAT .WTH writer.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the src-layout package itself so every test—including
          # module-level imports in skipped live tests—uses the public API.
          python -m pip install -e ".[dev]"

      - name: Run complete Python offline suite
        run: |
          python -m pytest tests -v

  r-tests:
    name: R (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libsqlite3-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload, any::testthat, any::ncdf4, any::DBI, any::RSQLite
          install-pandoc: false

      - name: Run R tests
        shell: Rscript {0}
        run: |
          pkgload::load_all('.', quiet = TRUE)
          testthat::test_dir('tests/testthat', reporter = 'summary', stop_on_failure = TRUE)
