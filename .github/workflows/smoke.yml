name: smoke

# Offline smoke test: no internet APIs, no DSSAT executable required.
# Validates config loading, helper-module imports, and the DSSAT .WTH writer.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas xarray netCDF4 geopandas shapely requests pyyaml sqlite-utils

      - name: Run Python comprehensive tests
        run: |
          python -m pytest tests/test_comprehensive.py -v

      - name: Run Python smoke tests
        run: |
          python -m pytest tests/test_smoke.py -v

  r-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libsqlite3-dev

      - name: Install R package dependencies
        run: |
          Rscript -e 'install.packages(c("pkgload", "testthat", "daymetr", "nasapower", "soilDB", "sf", "terra", "ncdf4", "httr", "jsonlite", "dplyr", "tidyr", "stringr", "readr", "lubridate", "foreach", "doParallel", "pbapply", "DSSAT", "DBI", "RSQLite", "yaml"))'

      - name: Run R tests
        run: |
          Rscript -e "pkgload::load_all(); testthat::test_dir('tests/testthat')"
