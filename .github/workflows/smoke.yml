name: smoke

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  fast-unit:
    name: Fast Unit (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run complete Python offline suite
        run: |
          python -m pytest tests -v -m "not live" --junit-xml=test-results.xml

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-unit-python-results
          path: test-results.xml

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libsqlite3-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload, any::testthat, any::ncdf4, any::DBI, any::RSQLite, any::ecmwfr
          install-pandoc: false

      - name: Run R offline tests
        shell: Rscript {0}
        env:
          RUN_POLARIS_LIVE: "false"
        run: |
          pkgload::load_all('.', quiet = TRUE)
          testthat::test_dir('tests/testthat', reporter = 'summary', stop_on_failure = TRUE)

  platform-compat:
    name: Platform Compat (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python offline suite
        run: |
          python -m pytest tests -v -m "not live" --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-compat-${{ matrix.os }}-results
          path: test-results.xml
