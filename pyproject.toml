[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dssatutils"
version = "0.1.0"
description = "Shared weather & soil download utilities for DSSAT gridded pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alwin Hopf" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.9",
    "rasterio>=1.3",
    "xarray>=2024.6",
    "netCDF4>=1.6",
    "requests>=2.32",
    "tqdm>=4.66",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# AgERA5 needs a free Copernicus CDS API key + the cdsapi client.
agera5 = ["cdsapi>=0.7"]
# HWSD only needs pyodbc when hwsd_db_file points at the FAO Microsoft Access
# .mdb directly (plus the OS Microsoft Access ODBC driver). Not needed for .sqlite.
hwsd = ["pyodbc>=4.0"]
# Everything optional (AgERA5 + HWSD .mdb + anything added later).
all = ["cdsapi>=0.7", "pyodbc>=4.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/alwinhopf/dssatutils"

# Package code lives under python/dssatutils
[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
