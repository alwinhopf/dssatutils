[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dssatutils"
version = "0.5.0"
description = "Shared weather & soil download utilities for DSSAT gridded pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alwin Hopf" }]
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.9",
    "rasterio>=1.3",
    "xarray>=2024.6",
    "netCDF4>=1.6",
    "requests>=2.32",
    "tqdm>=4.66",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# CDS-backed weather sources need a free Copernicus CDS API key + cdsapi.
cds = ["cdsapi>=0.7"]
# Backwards-compatible extras for source-specific installs.
agera5 = ["cdsapi>=0.7"]
era5 = ["cdsapi>=0.7"]
eobs-cds = ["cdsapi>=0.7"]
# HWSD only needs pyodbc when hwsd_db_file points at the FAO Microsoft Access
# .mdb directly (plus the OS Microsoft Access ODBC driver). Not needed for .sqlite.
hwsd = ["pyodbc>=4.0"]
# Everything optional (CDS-backed weather + HWSD .mdb + anything added later).
all = ["cdsapi>=0.7", "pyodbc>=4.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/alwinhopf/dssatutils"

# Package code lives under python/dssatutils
[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
dssatutils = ["config.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
markers = [
    "live: tests that download live remote data and may use hundreds of MiB of cache",
]
